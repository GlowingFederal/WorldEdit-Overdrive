buildscript {
    repositories {
        mavenCentral()

        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }

        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }

        maven {
            name = "jitpack"
            url = "https://jitpack.io"
        }

        maven {
            name = "gt"
            url = "https://gregtech.mechaenetia.com/"
        }
    }
    dependencies {
        classpath 'com.github.GTNewHorizons:ForgeGradle:1.2.11'
    }
}

apply plugin: 'forge'

group = 'com.glowingfederal.worldeditoverdrive'
version = '1.0.0'
archivesBaseName = 'WorldEditOverdrive'

sourceCompatibility = 1.8
targetCompatibility = 1.8

// Keep the active addon boundary explicit while the legacy KAWE sources remain
// in this repository as porting reference material.
sourceSets {
    main {
        java {
            include 'com/glowingfederal/worldeditoverdrive/**'
        }
    }
}

repositories {
    // Plain Maven syntax is required by this ForgeGradle/Gradle generation.
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    // WorldEdit Enhanced is supplied as a separate mod at runtime.
    compile 'curse.maven:worldedit-legacy-enhanced-1135144:5879351'
}

minecraft {
    version = '1.7.10-10.13.4.1614-1.7.10'
    runDir = 'run'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcVersion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcVersion': project.minecraft.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes 'FMLCorePlugin': 'com.glowingfederal.worldeditoverdrive.integration.OverdriveLoadingPlugin',
                'FMLCorePluginContainsFMLMod': 'true'
    }
}
